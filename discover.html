<!DOCTYPE html>

<html lang="en">  

    <head>
        <title> Discover</title> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Nikoletta Dimitriadi">
        <link rel="icon" href="./images/tabicon.png">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <link rel="stylesheet" href="./CSS/style.css">
        <link rel="stylesheet" href="./CSS/discover.css">

        <script src="./Javascript/script.js" defer></script>
        <script src="./Javascript/discover.js" defer></script>

   </head>

    <body>

        <!-- HEADER -->
        <div id="header-placeholder"></div>

        <div class="discover-container">   
            <h1 class="orange-title">Discover Athens</h1>
        </div> 

        <div class="weather-container">
            <div id="weather-widget" class="weather-card">
                <div class="weather-info">
                    <h3><b>Athens Weather</b></h3>
                    <p id="weather-description" >Loading...</p>
                    <h2 id="weather-temperature">--°C</h2>
                </div>
                <div class="weather-icon-container">
                    <i id="weather-icon" class="bi bi-hourglass-split"></i>
                </div>
            </div>
        </div>

        
        <!-- FOOTER-->
        <div id="footer-placeholder"></div>

        <dark-mode-toggle></dark-mode-toggle>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
